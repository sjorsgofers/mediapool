<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Theatershows – Video App</title>
  <meta name="theme-color" content="#05080F" />
  <style>
    /* =========================================================
       Theatershow Video App — multi-show
       Palette inspired by dansschoolfresh.com (electric blue / navy)
       ========================================================= */
    :root {
      --bg-0:#05080F;
      --bg-1:#0B1220;
      --surface:#0F1A30;
      --surface-2:#142444;
      --border:rgba(120,170,255,.14);
      --border-strong:rgba(120,170,255,.30);
      --text:#EAF2FF;
      --muted:#9BB0D0;
      --muted-2:#6F89B0;

      --brand:#0EA5E9;        /* cyan-500 */
      --brand-2:#38BDF8;      /* cyan-400 */
      --brand-3:#0B5CAB;      /* deep blue */
      --brand-4:#0369A1;      /* sky-700  */

      --radius-sm:12px;
      --radius:18px;
      --radius-lg:26px;
      --radius-xl:30px;

      --shadow-soft: 0 10px 30px -12px rgba(4,12,30,.6), 0 2px 6px rgba(4,12,30,.35);
      --shadow-glow: 0 0 0 1px rgba(56,189,248,.25), 0 22px 60px -22px rgba(14,165,233,.55);

      --maxw:1380px;

      --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }

    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin:0;
      min-height:100dvh;
      background:
        radial-gradient(1200px 600px at 8% -10%, rgba(14,165,233,.22), transparent 60%),
        radial-gradient(900px 520px at 112% 0%, rgba(56,189,248,.16), transparent 60%),
        linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 42%, var(--bg-0) 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      line-height:1.55;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width:100%; display:block; }
    button { font-family:inherit; }

    /* ====== Floating orbs background ====== */
    .bg-orbs { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.35; animation:float 18s ease-in-out infinite; }
    .orb-1 { width:520px; height:520px; background:#0ea5e9; top:-130px; left:-90px; }
    .orb-2 { width:430px; height:430px; background:#38bdf8; bottom:-130px; right:-90px; animation-delay:-6s; opacity:.24; }
    .orb-3 { width:380px; height:380px; background:#0b5cab; top:42%; left:50%; transform:translate(-50%,-50%); opacity:.22; animation-delay:-12s; }
    @keyframes float {
      0%,100% { transform:translate(0,0) scale(1); }
      50% { transform:translate(30px,-22px) scale(1.08); }
    }

    .app { width:100%; min-height:100dvh; padding:clamp(16px,2vw,30px); }
    .shell { max-width:var(--maxw); margin:0 auto; }

    /* ====== Header ====== */
    .hero {
      position:sticky; top:clamp(8px,1.4vw,16px); z-index:20;
      margin-bottom:26px;
      backdrop-filter:blur(16px) saturate(140%);
      -webkit-backdrop-filter:blur(16px) saturate(140%);
      background:linear-gradient(180deg, rgba(11,18,32,.9), rgba(11,18,32,.66));
      border:1px solid var(--border-strong);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow-soft);
      overflow:hidden;
    }
    .hero-inner { padding:clamp(18px,3vw,30px); display:grid; gap:16px; }

    .eyebrow {
      display:inline-flex; width:fit-content; align-items:center; gap:10px;
      padding:9px 14px; border-radius:999px;
      border:1px solid var(--border-strong);
      background:rgba(56,189,248,.12);
      color:var(--brand-2);
      font-weight:700; letter-spacing:.10em; text-transform:uppercase; font-size:12px;
    }
    .eyebrow .dot { width:8px; height:8px; border-radius:50%; background:var(--brand-2); box-shadow:0 0 12px var(--brand-2); animation:pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.5;transform:scale(.85)} 50%{opacity:1;transform:scale(1.15)} }

    h1 {
      margin:0; font-size:clamp(28px,5vw,52px); line-height:1.02; letter-spacing:-.03em;
      background:linear-gradient(120deg,#fff 0%, #cfe6ff 40%, var(--brand-2) 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .sub { margin:0; color:var(--muted); font-size:clamp(14px,2vw,18px); max-width:820px; }

    .back {
      display:inline-flex; align-items:center; gap:9px; width:fit-content;
      padding:11px 16px 11px 13px; border-radius:999px;
      border:1px solid var(--border-strong); background:rgba(255,255,255,.04);
      color:var(--text); font-weight:700; font-size:14px; cursor:pointer;
      transition:background .2s ease, transform .2s ease, border-color .2s ease;
    }
    .back:hover { background:rgba(56,189,248,.12); border-color:var(--brand-2); transform:translateX(-2px); }
    .back svg { width:18px; height:18px; }

    .toolbar { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; }
    .search {
      display:flex; align-items:center; gap:12px;
      background:rgba(255,255,255,.05); border:1px solid var(--border);
      border-radius:999px; padding:13px 18px; min-height:54px;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .search:focus-within { border-color:var(--brand-2); box-shadow:0 0 0 4px rgba(56,189,248,.14); }
    .search svg { width:20px; height:20px; flex:0 0 20px; opacity:.7; }
    .search input { appearance:none; background:transparent; border:0; outline:0; width:100%; color:#fff; font-size:16px; }
    .search input::placeholder { color:#7e93b6; }
    .count {
      min-width:120px; text-align:center; padding:13px 18px; border-radius:999px;
      border:1px solid var(--border); background:rgba(56,189,248,.08);
      font-weight:700; color:var(--brand-2); white-space:nowrap;
    }

    /* ====== Views / transitions ====== */
    .view { animation:viewIn .45s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes viewIn { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }

    /* ====== Grids ====== */
    .grid { display:grid; grid-template-columns:repeat(1,minmax(0,1fr)); gap:18px; }
    @media (min-width:640px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (min-width:1000px){ .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (min-width:1340px){ .grid-videos{ grid-template-columns:repeat(4,minmax(0,1fr)); } }

    /* ====== Show cards ====== */
    .show-card {
      position:relative; display:block; cursor:pointer; text-align:left;
      border:1px solid var(--border-strong); border-radius:var(--radius-lg);
      overflow:hidden; background:var(--surface);
      box-shadow:var(--shadow-soft);
      transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      padding:0; width:100%; color:inherit;
      opacity:0; animation:cardIn .5s ease forwards;
    }
    @keyframes cardIn { to{ opacity:1; } }
    .show-card:hover { transform:translateY(-4px); border-color:var(--brand-2); box-shadow:var(--shadow-glow); }
    .show-cover { position:relative; aspect-ratio:16/10; overflow:hidden; background:linear-gradient(135deg,var(--brand-3),var(--bg-0)); }
    .show-cover img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
    .show-card:hover .show-cover img { transform:scale(1.06); }
    .show-cover::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,8,15,.05) 0%, rgba(5,8,15,.55) 60%, rgba(5,8,15,.92) 100%); }
    .show-cover .cover-fallback {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:64px; opacity:.5;
    }
    .show-overlay { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:20px; }
    .show-chip {
      display:inline-flex; align-items:center; gap:8px; margin-bottom:10px;
      padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700;
      background:rgba(56,189,248,.16); border:1px solid var(--border-strong); color:var(--brand-2);
      backdrop-filter:blur(8px);
    }
    .show-title { margin:0; font-size:clamp(20px,2.6vw,26px); line-height:1.1; letter-spacing:-.02em; }
    .show-meta { margin:6px 0 0; color:var(--muted); font-size:14px; display:flex; align-items:center; gap:8px; }
    .play-fab {
      position:absolute; top:16px; right:16px; z-index:2;
      width:50px; height:50px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(56,189,248,.18); border:1px solid var(--border-strong);
      backdrop-filter:blur(10px); color:#fff;
      transform:scale(.85); opacity:0; transition:transform .25s ease, opacity .25s ease, background .25s ease;
    }
    .show-card:hover .play-fab { transform:scale(1); opacity:1; background:var(--brand); }
    .play-fab svg { width:20px; height:20px; margin-left:2px; }

    .show-empty-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:200px; color:var(--muted-2); }

    /* ====== Video cards ====== */
    .card {
      display:grid; grid-template-rows:auto 1fr;
      background:linear-gradient(180deg, var(--surface) 0%, var(--bg-1) 100%);
      border:1px solid var(--border); border-radius:var(--radius-lg);
      overflow:hidden; box-shadow:var(--shadow-soft); min-width:0;
      transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      opacity:0; animation:cardIn .5s ease forwards;
    }
    .card:hover { transform:translateY(-3px); border-color:var(--brand-2); box-shadow:var(--shadow-glow); }
    .thumb-wrap { position:relative; aspect-ratio:16/9; background:#070b14; overflow:hidden; }
    .thumb { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
    .card:hover .thumb { transform:scale(1.05); }
    .thumb-wrap::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%, rgba(5,8,15,.5)); opacity:0; transition:opacity .2s ease; }
    .card:hover .thumb-wrap::after { opacity:1; }
    .badge {
      position:absolute; top:12px; left:12px; z-index:2; padding:7px 12px; border-radius:999px;
      background:rgba(5,8,15,.7); border:1px solid var(--border-strong); color:#fff;
      font-weight:700; font-size:12px; backdrop-filter:blur(10px);
    }
    .play-mini {
      position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity .25s ease;
    }
    .play-mini span {
      width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      background:var(--brand); box-shadow:0 10px 30px -8px rgba(14,165,233,.8); transform:scale(.8); transition:transform .25s ease;
    }
    .card:hover .play-mini { opacity:1; }
    .card:hover .play-mini span { transform:scale(1); }
    .play-mini svg { width:22px; height:22px; margin-left:3px; color:#001; }

    .content { padding:16px; display:grid; gap:12px; min-width:0; }
    .title { margin:0; font-size:17px; line-height:1.3; letter-spacing:-.01em; word-break:break-word; }
    .meta { color:var(--muted); font-size:13.5px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:auto; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:9px;
      min-height:46px; padding:11px 14px; border-radius:999px;
      font-weight:800; font-size:14.5px; text-align:center; border:1px solid transparent;
      transition:transform .18s ease, opacity .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .btn:hover { transform:translateY(-1px); }
    .btn svg { width:17px; height:17px; }
    .btn-watch { background:linear-gradient(120deg,var(--brand),var(--brand-2)); color:#001627; box-shadow:0 8px 24px -10px rgba(14,165,233,.8); }
    .btn-download { background:rgba(255,255,255,.05); color:#fff; border-color:var(--border); }
    .btn-download:hover { border-color:var(--brand-2); background:rgba(56,189,248,.10); }
    .btn-disabled { background:rgba(255,255,255,.03); color:var(--muted-2); border-color:var(--border); cursor:not-allowed; pointer-events:none; }

    .empty { display:none; margin-top:20px; padding:28px; border-radius:var(--radius-lg);
      border:1px solid var(--border); background:rgba(255,255,255,.02); text-align:center; color:var(--muted); line-height:1.6; }
    .empty b { color:var(--brand-2); }

    /* ====== Loading ====== */
    .loading { display:flex; align-items:center; justify-content:center; gap:14px; padding:60px 24px; color:var(--muted); font-weight:600; }
    .spinner { width:26px; height:26px; border-radius:50%; border:3px solid rgba(120,170,255,.2); border-top-color:var(--brand-2); animation:spin .8s linear infinite; }
    @keyframes spin { to{ transform:rotate(360deg); } }

    /* ====== Live chip (Drive show) ====== */
    .show-chip.live { background:rgba(34,211,138,.16); border-color:rgba(34,211,138,.4); color:#7ef0bd; }
    .show-card.dynamic .show-cover { background:linear-gradient(135deg,#0b3d2e 0%, #0b5cab 60%, var(--bg-0) 100%); }

    /* ====== Drive thumb fallback ====== */
    .thumb-wrap.no-thumb { display:flex; align-items:center; justify-content:center; }
    .thumb-wrap.no-thumb::before { content:"🎬"; font-size:46px; opacity:.5; }
    button.thumb-wrap { border:0; padding:0; width:100%; cursor:pointer; font:inherit; color:inherit; background:#070b14; }

    /* ====== Player modal ====== */
    .player { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:clamp(12px,3vw,32px); }
    .player.open { display:flex; animation:viewIn .25s ease both; }
    .player-backdrop { position:absolute; inset:0; background:rgba(3,6,12,.82); backdrop-filter:blur(8px); }
    .player-box {
      position:relative; z-index:1; width:min(1100px,100%);
      background:var(--surface); border:1px solid var(--border-strong);
      border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-glow);
    }
    .player-bar { display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border); }
    .player-title { flex:1; font-weight:700; font-size:16px; letter-spacing:-.01em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .player-close {
      flex:0 0 auto; width:40px; height:40px; border-radius:50%; cursor:pointer;
      display:flex; align-items:center; justify-content:center; color:#fff;
      background:rgba(255,255,255,.06); border:1px solid var(--border);
      transition:background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .player-close:hover { background:rgba(56,189,248,.16); border-color:var(--brand-2); transform:rotate(90deg); }
    .player-close svg { width:20px; height:20px; }
    .player-frame { aspect-ratio:16/9; background:#000; }
    .player-frame iframe { width:100%; height:100%; border:0; display:block; }

    .footer-note { margin-top:28px; color:var(--muted-2); font-size:13px; text-align:center; }
    .footer-note b { color:var(--brand-2); font-weight:700; }

    @media (max-width:760px){
      .toolbar { grid-template-columns:1fr; }
      .count { width:100%; }
      .actions { grid-template-columns:1fr; }
      .hero { position:static; }
    }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after { animation:none !important; transition:none !important; }
    }
  </style>
</head>

          { title: "Voor mama", youtubeId: "u2Zcmmp6zbE", download: "https://drive.google.com/uc?export=download&id=1l9q_oeql-yCfgVob4hTsi_qIyyKCctnr" },
          { title: "Modern Advanced 2", youtubeId: "GoRGsIgU7Qc", download: "https://drive.google.com/uc?export=download&id=14ER_d_Sz5iC8QL2gLsyJ0d9-FKhddcme" },
          { title: "The Ultimate 2", youtubeId: "5hSJWPCIUNY", download: "https://drive.google.com/uc?export=download&id=11cQ5hcIKQgHmoDr8QdGh0Fo7uS29BxS_" },
          { title: "Happy", youtubeId: "_gsVSG_66q4", download: "https://drive.google.com/uc?export=download&id=1UgZRWsbOw1riW6rxMVvg_Yik4AQYLUSV" },
          { title: "Louis", youtubeId: "V78rDsal6wo", download: "https://drive.google.com/uc?export=download&id=1yMef2ZDdj7HjBM2i1SEIxkimGMu1jrZo" },
          { title: "Docentendans", youtubeId: "n3yKUdU6TJw", download: "https://drive.google.com/uc?export=download&id=131b8YQCRAzzBa2decd1ICYuOazInOi6P" },
          { title: "The Spirit of Africa / Afro Advanced", youtubeId: "roLPlb0Bq_k", download: "https://drive.google.com/uc?export=download&id=15Fhd8ECphIvklSQ0MS0K4MbX8ZR6M918" },
          { title: "Lichtje branden", youtubeId: "g7xyYU-J0BM", download: "https://drive.google.com/uc?export=download&id=1QR98FkhK1Ipcc6tmWtqCWMUxjDAleAr-" },
          { title: "Finale", youtubeId: "h9ZZiZlFM8Q", download: "https://drive.google.com/uc?export=download&id=1P7mzK7Y0z7To0K0WBi4mgNovVkjjy-EK" }
        ]
      },

      /* ───── DRIVE-SHOW — haalt de video's realtime uit een Google Drive-map ─────
         Zet "driveFolderId" op de id van je openbare Drive-map (het stukje na
         /folders/ in de URL). De app laadt de video's bij elke keer openen,
         sorteert ze A-Z op bestandsnaam en gebruikt de bestandsnaam als titel.
         Vereist een gratis API-sleutel: zie DRIVE_API_KEY bovenaan het script. */
      {
        id: "jungle-eindshow-2026",
        title: "Jungle - Eindshow 2026",
        date: "2026",
        subtitle: "De video's worden live uit Google Drive geladen. Klik om in de app af te spelen of te downloaden.",
        cover: "2.png",
        dynamic: true,
        driveFolderId: "1wD2OM7l6FVGqLkazVCAg8iwy66eCLEKh",
        videos: null
      }
    ];

    /* ========================== App logica ========================== */
    const content     = document.getElementById('content');
    const emptyState   = document.getElementById('emptyState');
    const backBtn      = document.getElementById('backBtn');
    const toolbar      = document.getElementById('toolbar');
    const searchInput  = document.getElementById('searchInput');
    const visibleCount = document.getElementById('visibleCount');
    const pageTitle    = document.getElementById('pageTitle');
    const pageSub      = document.getElementById('pageSub');
    const eyebrow      = document.getElementById('eyebrow');
    const eyebrowText  = document.getElementById('eyebrowText');

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }
    function ytWatch(id){ return `https://youtu.be/${id}`; }
    function ytThumb(id){ return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }
    function thumbFallback(id){
      return `if(!this.dataset.f1){this.dataset.f1='1';this.src='https://i.ytimg.com/vi/${id}/mqdefault.jpg';}`
           + `else if(!this.dataset.f2){this.dataset.f2='1';this.src='https://i.ytimg.com/vi/${id}/default.jpg';}`
           + `else{this.style.display='none';this.parentElement.style.background='#0b1220';}`;
    }
    function showCover(show){
      if(show.cover) return show.cover;
      if(show.dynamic) return null;
      const first = (show.videos || []).find(v => v.youtubeId);
      return first ? `https://i.ytimg.com/vi/${first.youtubeId}/maxresdefault.jpg` : null;
    }

    /* ---------- Google Drive helpers ---------- */
    const VIDEO_EXT = /\.(mp4|mov|m4v|webm|avi|mkv|wmv|flv)$/i;
    function driveThumb(id){ return `https://drive.google.com/thumbnail?id=${id}&sz=w640`; }
    function drivePreview(id){ return `https://drive.google.com/file/d/${id}/preview`; }
    function driveDownload(id){ return `https://drive.google.com/uc?export=download&id=${id}`; }
    function driveThumbFallback(){
      return "this.style.display='none';this.parentElement.classList.add('no-thumb');";
    }

    // Haalt de video's uit een openbare Drive-map op, gesorteerd A-Z op naam.
    async function fetchDriveVideos(folderId){
      const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'video/' and trashed = false`);
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}`
        + `&key=${DRIVE_API_KEY}`
        + `&fields=${encodeURIComponent('files(id,name,mimeType)')}`
        + `&orderBy=name_natural`
        + `&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true`;
      const res = await fetch(url);
      if(!res.ok){
        let detail = '';
        try { detail = (await res.json())?.error?.message || ''; } catch(e){}
        throw new Error(`Drive API ${res.status}${detail ? ': ' + detail : ''}`);
      }
      const data = await res.json();
      const files = (data.files || []).map(f => ({
        driveId: f.id,
        title: f.name.replace(VIDEO_EXT, '')
      }));
      files.sort((a, b) => a.title.localeCompare(b.title, 'nl', { numeric: true, sensitivity: 'base' }));
      return files;
    }

    /* ---------- Show-selectiescherm ---------- */
    function renderShows(){
      backBtn.style.display = 'none';
      toolbar.style.display = 'none';
      emptyState.style.display = 'none';
      eyebrow.style.display = 'none';
      pageTitle.textContent = 'Fresh show archief';
      pageSub.textContent = "Selecteer een voorstelling om alle video's terug te kijken of te downloaden.";

      content.className = 'view';
      content.innerHTML = `<div class="grid grid-shows">` + shows.map((show, i) => {
        const cover = showCover(show);
        const firstYt = (show.videos || [])[0];
        const coverHtml = cover
          ? `<img src="${cover}" alt="${escapeHtml(show.title)}" loading="lazy" referrerpolicy="no-referrer"
                 onerror="${firstYt ? thumbFallback(firstYt.youtubeId) : "this.style.display='none'"}" />`
          : `<div class="cover-fallback">${show.dynamic ? '🌴' : '🎭'}</div>`;
        return `
          <button class="show-card${show.dynamic ? ' dynamic' : ''}" style="animation-delay:${i*70}ms" onclick="openShow('${show.id}')" aria-label="Open ${escapeHtml(show.title)}">
            <div class="show-cover">
              ${coverHtml}
              <div class="play-fab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
            </div>
            <div class="show-overlay">
              <h2 class="show-title">${escapeHtml(show.title)}</h2>
              <p class="show-meta">📅 ${escapeHtml(show.date)}</p>
            </div>
          </button>`;
      }).join('') + `</div>`;
    }

    /* ---------- Videopagina van één show ---------- */
    let currentShow = null;
    let currentVideos = [];     // de video's die nu getoond worden
    let loadToken = 0;          // voorkomt dat een trage Drive-laadbeurt een nieuwere overschrijft

    // Bouwt één videokaart, voor zowel YouTube- als Drive-video's.
    function videoCard(video, index){
      const isDrive = !!video.driveId;
      const thumbHtml = isDrive
        ? `<img class="thumb" src="${driveThumb(video.driveId)}" alt="${escapeHtml(video.title)}" loading="lazy"
               referrerpolicy="no-referrer" onerror="${driveThumbFallback()}" />`
        : `<img class="thumb" src="${ytThumb(video.youtubeId)}" alt="${escapeHtml(video.title)}" loading="lazy"
               referrerpolicy="no-referrer" onerror="${thumbFallback(video.youtubeId)}" />`;

      const downloadHref = isDrive ? driveDownload(video.driveId) : video.download;
      const downloadButton = downloadHref
        ? `<a class="btn btn-download" href="${downloadHref}" target="_blank" rel="noopener noreferrer" download>
             <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
             Download</a>`
        : `<span class="btn btn-disabled" aria-disabled="true">Geen download</span>`;

      // Drive → speelt in de app (modal). YouTube → opent op YouTube.
      const thumbOpen = isDrive
        ? `<button class="thumb-wrap" onclick="openPlayer('${video.driveId}', this.dataset.title)" data-title="${escapeHtml(video.title)}" aria-label="Speel ${escapeHtml(video.title)} af">`
        : `<a class="thumb-wrap" href="${ytWatch(video.youtubeId)}" target="_blank" rel="noopener noreferrer" aria-label="Bekijk ${escapeHtml(video.title)}">`;
      const thumbClose = isDrive ? `</button>` : `</a>`;

      const watchButton = isDrive
        ? `<button class="btn btn-watch" onclick="openPlayer('${video.driveId}', this.dataset.title)" data-title="${escapeHtml(video.title)}">
             <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Afspelen</button>`
        : `<a class="btn btn-watch" href="${ytWatch(video.youtubeId)}" target="_blank" rel="noopener noreferrer">
             <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Bekijken</a>`;

      const meta = isDrive
        ? 'Afspelen in de app of downloaden'
        : (video.download ? 'YouTube of download via Drive' : 'Alleen via YouTube');

      return `
        <article class="card" style="animation-delay:${index*45}ms">
          ${thumbOpen}
            ${thumbHtml}
            <div class="badge">${index + 1}</div>
            <div class="play-mini"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>
          ${thumbClose}
          <div class="content">
            <h2 class="title">${escapeHtml(video.title)}</h2>
            <div class="meta">${meta}</div>
            <div class="actions">
              ${watchButton}
              ${downloadButton}
            </div>
          </div>
        </article>`;
    }

    // Tekent de geladen video's (en filtert op zoekterm).
    function renderVideoCards(filter=''){
      const q = filter.trim().toLowerCase();
      const filtered = currentVideos.filter(v => v.title.toLowerCase().includes(q));
      content.innerHTML = `<div class="grid grid-videos">`
        + filtered.map((v, i) => videoCard(v, i)).join('')
        + `</div>`;
      visibleCount.textContent = filtered.length;
      emptyState.style.display = filtered.length ? 'none' : 'block';
    }

    function showStateMessage(html){
      content.innerHTML = `<div class="empty" style="display:block">${html}</div>`;
      emptyState.style.display = 'none';
    }

    // Laadt een show: YouTube-shows direct, Drive-shows realtime via de API.
    async function loadShow(show){
      const token = ++loadToken;
      searchInput.value = '';

      if(show.dynamic){
        if(DRIVE_API_KEY === "PLAK_HIER_JE_GOOGLE_API_SLEUTEL"){
          visibleCount.textContent = 0;
          showStateMessage(`Stel eerst je Google API-sleutel in (de constante <b>DRIVE_API_KEY</b> bovenaan het script) om de video's uit Drive te laden.`);
          return;
        }
        visibleCount.textContent = '…';
        content.innerHTML = `<div class="loading"><span class="spinner"></span> Video's laden uit Google Drive…</div>`;
        emptyState.style.display = 'none';
        try {
          const videos = await fetchDriveVideos(show.driveFolderId);
          if(token !== loadToken) return;   // gebruiker is alweer ergens anders
          currentVideos = videos;
          if(videos.length === 0){
            visibleCount.textContent = 0;
            showStateMessage(`Er staan nog geen video's in de Drive-map. Zodra je ze toevoegt, verschijnen ze hier automatisch.`);
            return;
          }
          renderVideoCards();
        } catch(err){
          if(token !== loadToken) return;
          visibleCount.textContent = 0;
          showStateMessage(`Kon de video's niet laden uit Drive.<br><span style="color:var(--muted-2);font-size:13px">${escapeHtml(err.message)}</span><br><br>Controleer of de map openbaar staat ("iedereen met de link → lezer") en of je API-sleutel klopt.`);
        }
        return;
      }

      // Statische (YouTube) show
      currentVideos = show.videos || [];
      if(currentVideos.length === 0){
        visibleCount.textContent = 0;
        showStateMessage(`Deze show heeft nog geen video's. Voeg ze toe in de <b>shows</b>-lijst bovenin de code.`);
        return;
      }
      renderVideoCards();
    }

    /* ---------- Ingebedde speler (modal) ---------- */
    const player      = document.getElementById('player');
    const playerFrame = document.getElementById('playerFrame');
    const playerTitle = document.getElementById('playerTitle');

    function openPlayer(driveId, title){
      playerFrame.src = drivePreview(driveId);
      playerTitle.textContent = title || '';
      player.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closePlayer(){
      player.classList.remove('open');
      playerFrame.src = '';
      document.body.style.overflow = '';
    }
    player.addEventListener('click', e => { if(e.target.dataset.close !== undefined) closePlayer(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape' && player.classList.contains('open')) closePlayer(); });

    /* ---------- Routing ---------- */
    function openShow(id){ location.hash = '#/show/' + id; }
    function goHome(){ location.hash = '#/'; }
    backBtn.addEventListener('click', goHome);

    function route(){
      const hash = location.hash || '#/';
      const match = hash.match(/^#\/show\/(.+)$/);
      window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
      closePlayer();

      if(match){
        const show = shows.find(s => s.id === decodeURIComponent(match[1]));
        if(show){
          currentShow = show;
          backBtn.style.display = 'inline-flex';
          toolbar.style.display = 'grid';
          eyebrow.style.display = 'inline-flex';
          eyebrowText.textContent = 'Mediapool';
          pageTitle.textContent = show.title;
          pageSub.textContent = show.subtitle || '';
          content.className = 'view';
          loadShow(show);
          return;
        }
      }
      currentShow = null;
      currentVideos = [];
      loadToken++;
      renderShows();
    }

    searchInput.addEventListener('input', e => renderVideoCards(e.target.value));
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
